<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Macro Facts — Know Your Numbers</title>
<meta name="description" content="Your daily calorie and macro targets, food log, exercise log, and trends — all in one place." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EFFB;
    --ink: #1C1B29;
    --ink-soft: rgba(28,27,41,0.62);
    --card: #FFFFFF;
    --yellow: #F5C518;
    --protein: #D14B32;
    --carb: #C99A2E;
    --fat: #4F6B45;
    --grad-target: linear-gradient(135deg,#6E7CF6 0%,#9B6EF6 100%);
    --grad-food: linear-gradient(160deg,#FF9A56 0%,#FF6F3D 100%);
    --grad-weight: linear-gradient(160deg,#241C4E 0%,#3B2E73 100%);
    --grad-history: linear-gradient(135deg,#FF7AA8 0%,#FF9A6E 100%);
    --grad-stats: linear-gradient(135deg,#EAE6FC 0%,#CFE0FF 100%);
    --grad-premium: linear-gradient(135deg,#232323 0%,#000000 100%);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: 'Luckiest Guy', 'Space Grotesk', sans-serif; font-weight: 400; letter-spacing: 0.02em; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  /* ============ DASHBOARD ============ */
  .dash-wrap { max-width: 460px; margin: 0 auto; padding: 1.4rem 1.1rem 0.5rem; }
  .dash-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.5; margin-bottom: 0.3rem; }
  .dash-title { font-size: 1.7rem; margin: 0 0 1.1rem; }
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .tile {
    border-radius: 26px;
    padding: 1.15rem;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(28,27,41,0.10);
    transition: transform 0.15s ease;
    border: none;
    text-align: left;
    font-family: inherit;
  }
  .tile:active { transform: scale(0.97); }
  .tile-full { grid-column: 1 / -1; }
  .tile-white { background: var(--card); color: var(--ink); }
  .tile-dark { color: #F4F1FB; }
  .tile-label { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.5rem; }
  .tile-sub { font-size: 0.82rem; line-height: 1.35; opacity: 0.85; }
  .tile-icon { font-size: 1.5rem; margin-bottom: 0.5rem; display: block; }
  .tile-target { background: var(--grad-target); color: #fff; min-height: 148px; display: flex; flex-direction: column; justify-content: space-between; }
  .tile-target .big-num { font-size: 2.5rem; line-height: 1; }
  .tile-stats { background: var(--grad-stats); color: var(--ink); }
  .tile-weight { background: var(--grad-weight); min-height: 150px; display:flex; flex-direction:column; justify-content:space-between; }
  .tile-food { background: var(--grad-food); color: #fff; min-height: 150px; display:flex; flex-direction:column; justify-content:space-between; }
  .tile-exercise { background: var(--card); color: var(--ink); min-height: 150px; }
  .tile-quick { background: var(--card); color: var(--ink); }
  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .quick-btn { background: #F4F1FB; border-radius: 16px; padding: 0.7rem 0; text-align: center; font-size: 1.3rem; border: none; cursor: pointer; }
  .quick-btn span.qlabel { display:block; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.25rem; font-family: 'IBM Plex Mono', monospace; opacity: 0.6; }
  .tile-history { background: var(--grad-history); color: #fff; min-height: 130px; }
  .tile-premium { background: var(--grad-premium); color: var(--yellow); }
  .lock-pill { display:inline-block; font-family:'IBM Plex Mono', monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; background: rgba(255,255,255,0.25); padding: 0.15rem 0.5rem; border-radius: 20px; margin-bottom: 0.4rem; }

  /* ============ DETAIL SECTIONS ============ */
  .app-wrap { display: flex; justify-content: center; padding: 1rem 6vw 8vh; }
  .app-shell { width: 100%; max-width: 460px; }
  .section-tag { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.2em; opacity: 0.5; margin-bottom: 0.5rem; scroll-margin-top: 1rem; }

  .card { border-radius: 22px; margin-bottom: 1.6rem; background: var(--card); box-shadow: 0 6px 18px rgba(28,27,41,0.07); overflow: hidden; }
  .card-head { padding: 1rem 1.15rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; display:flex; justify-content: space-between; align-items:center; border-bottom: 1px solid rgba(28,27,41,0.08); }
  .card-body { padding: 1.15rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .full { grid-column: 1 / -1; }
  .field-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.55; margin-bottom: 0.4rem; }
  input[type="number"], input[type="text"], select {
    width: 100%;
    border: 1.5px solid rgba(28,27,41,0.18);
    border-radius: 12px;
    padding: 0.5rem 0.6rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
    background: #FAF9FE;
    color: var(--ink);
  }
  select { font-family: 'Space Grotesk', sans-serif; }
  .toggle-row { display: flex; gap: 0.5rem; }
  .toggle-btn {
    flex: 1;
    padding: 0.5rem 0;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    border-radius: 12px;
    border: 1.5px solid rgba(28,27,41,0.18);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .toggle-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .facts-box { border-radius: 22px; padding: 1.1rem 1.15rem 1.2rem; background: var(--card); box-shadow: 0 6px 18px rgba(28,27,41,0.07); }
  .facts-title { font-size: 1.6rem; padding-bottom: 0.4rem; }
  .cal-row { display: flex; justify-content: space-between; align-items: baseline; padding: 0.65rem 0; border-bottom: 2px solid rgba(28,27,41,0.1); }
  .cal-row span:first-child { font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .cal-num { font-size: 2.3rem; font-weight: 700; }
  .split-note { font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.03em; opacity: 0.55; padding: 0.55rem 0; border-bottom: 1px solid rgba(28,27,41,0.1); }
  .macro-row { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid rgba(28,27,41,0.08); border-left: 6px solid transparent; padding-left: 0.6rem; margin-left: -0.6rem; border-radius: 8px; }
  .macro-row.last { border-bottom: none; }
  .macro-left { display: flex; align-items: center; gap: 0.5rem; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .macro-name { font-size: 0.9rem; font-weight: 600; }
  .macro-grams { font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  .macro-pct { font-family: 'IBM Plex Mono', monospace; opacity: 0.5; font-size: 0.72rem; margin-left: 0.5rem; }
  .foot-note { font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem; opacity: 0.45; padding-top: 0.8rem; }

  .trend-badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.25rem 0.6rem; border-radius: 20px; background: var(--yellow); }
  .weigh-in-row { display: flex; gap: 0.6rem; align-items: flex-end; margin-bottom: 1.1rem; }
  .weigh-in-row input { flex: 1; }
  .log-btn {
    padding: 0.55rem 1.1rem;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    cursor: pointer;
  }
  .adjust-msg {
    font-size: 0.85rem;
    line-height: 1.5;
    padding: 0.85rem;
    border-radius: 14px;
    background: rgba(245,197,24,0.18);
    margin-bottom: 1rem;
  }
  .adjust-msg strong { font-family: 'IBM Plex Mono', monospace; }
  .empty-trend { font-size: 0.85rem; opacity: 0.55; text-align: center; padding: 1.2rem 0.5rem; }
  .history-list { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; opacity: 0.6; margin-top: 0.7rem; display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; }

  .premium-locked { padding: 1.3rem 1rem; text-align: center; }
  .premium-locked p { font-size: 0.85rem; opacity: 0.6; max-width: 20rem; margin: 0 auto 0.9rem; line-height: 1.5; }
  .lock-icon { font-size: 0.8rem; }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    width: fit-content;
    padding: 0.85rem 1.6rem;
    background: var(--ink);
    color: #fff;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    cursor: pointer;
  }

  .slider-block { margin-bottom: 1rem; }
  .slider-top { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.3rem; }
  input[type="range"] { width: 100%; accent-color: var(--ink); }
  .ratio-note { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; padding-top: 0.3rem; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(23,24,28,0.55);
    display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 50;
  }
  .modal { width: 100%; max-width: 380px; border-radius: 22px; background: var(--card); padding: 1.4rem; }
  .modal .price { font-size: 1.8rem; margin: 0.4rem 0 1rem; }
  .modal ul { list-style: none; padding: 0; margin: 0 0 1.1rem; font-size: 0.9rem; }
  .modal li { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
  .modal button, .modal a { width: 100%; padding: 0.75rem 0; font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; margin-bottom: 0.5rem; box-sizing: border-box; }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-secondary { background: transparent; color: var(--ink); opacity: 0.55; }

  .footer-note { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem; opacity: 0.4; margin-top: 1.6rem; }

  @keyframes toastIn {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  svg text { font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>

<div class="dash-wrap">
  <div class="dash-eyebrow">Today</div>
  <h1 class="dash-title display">Macro Facts</h1>
  <div class="dash-grid" id="dashGrid"></div>
</div>

<div class="app-wrap">
  <div class="app-shell" id="root"></div>
</div>

<script>
(function () {
  // ---- STRIPE CONFIG ----
  const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/4gMdR9fIY8m4fp35PW83C00O";

  const params = new URLSearchParams(window.location.search);
  const unlockedFromRedirect = params.get("premium") === "success";
  if (unlockedFromRedirect) {
    localStorage.setItem("macrofacts_premium", "true");
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  const alreadyPremium = localStorage.getItem("macrofacts_premium") === "true";

  function loadWeighIns() {
    try { const raw = localStorage.getItem("macrofacts_weighins"); return raw ? JSON.parse(raw) : []; }
    catch (e) { return []; }
  }
  function saveWeighIns(list) { localStorage.setItem("macrofacts_weighins", JSON.stringify(list)); }

  // ---- Food database: kcal & protein per 100g ----
  const FOOD_DB = [
    {name:"Chicken breast, cooked", kcal:165, protein:31},
    {name:"Chicken thigh, cooked", kcal:209, protein:26},
    {name:"Turkey breast, cooked", kcal:135, protein:30},
    {name:"Salmon, cooked", kcal:208, protein:20},
    {name:"Tuna, canned in water", kcal:116, protein:26},
    {name:"Shrimp, cooked", kcal:99, protein:24},
    {name:"Pork chop, cooked", kcal:231, protein:27},
    {name:"Ground beef 90/10, cooked", kcal:217, protein:26},
    {name:"Eggs, whole", kcal:155, protein:13},
    {name:"Egg whites", kcal:52, protein:11},
    {name:"Greek yogurt, plain nonfat", kcal:59, protein:10},
    {name:"Cottage cheese, low fat", kcal:72, protein:12},
    {name:"Tofu, firm", kcal:144, protein:15},
    {name:"Protein powder, whey (dry)", kcal:400, protein:80},
    {name:"Cheddar cheese", kcal:403, protein:25},
    {name:"Mozzarella, part-skim", kcal:254, protein:24},
    {name:"Whole milk", kcal:61, protein:3.2},
    {name:"Skim milk", kcal:34, protein:3.4},
    {name:"Hummus", kcal:166, protein:8},
    {name:"Black beans, cooked", kcal:132, protein:8.9},
    {name:"Lentils, cooked", kcal:116, protein:9},
    {name:"Chickpeas, cooked", kcal:164, protein:8.9},
    {name:"White rice, cooked", kcal:130, protein:2.7},
    {name:"Brown rice, cooked", kcal:123, protein:2.7},
    {name:"Quinoa, cooked", kcal:120, protein:4.4},
    {name:"Oats, dry", kcal:389, protein:16.9},
    {name:"Whole wheat bread", kcal:247, protein:13},
    {name:"White bread", kcal:265, protein:9},
    {name:"Pasta, cooked", kcal:131, protein:5},
    {name:"Sweet potato, baked", kcal:90, protein:2},
    {name:"Potato, baked", kcal:93, protein:2.5},
    {name:"Banana", kcal:89, protein:1.1},
    {name:"Apple", kcal:52, protein:0.3},
    {name:"Broccoli", kcal:34, protein:2.8},
    {name:"Spinach, raw", kcal:23, protein:2.9},
    {name:"Avocado", kcal:160, protein:2},
    {name:"Almonds", kcal:579, protein:21},
    {name:"Peanut butter", kcal:588, protein:25},
    {name:"Olive oil", kcal:884, protein:0},
    {name:"Butter", kcal:717, protein:0.9},
  ];

  // ---- Exercise database: MET values ----
  const EXERCISE_DB = [
    {name:"Walking (moderate)", met:3.5},
    {name:"Running (6 mph)", met:9.8},
    {name:"Cycling (moderate)", met:7.5},
    {name:"Weight training", met:5.0},
    {name:"Swimming (moderate)", met:7.0},
    {name:"Yoga", met:3.0},
    {name:"HIIT / circuit training", met:8.0},
    {name:"Elliptical", met:5.0},
    {name:"Basketball", met:6.5},
    {name:"Hiking", met:6.0},
    {name:"Dancing", met:5.5},
    {name:"Rowing machine", met:7.0},
    {name:"Stairmaster", met:9.0},
    {name:"Pilates", met:3.8},
    {name:"Boxing (training)", met:7.8},
  ];

  function dateKey(d) { return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
  function todayKey() { return `macrofacts_log_${dateKey(new Date())}`; }
  function todayExKey() { return `macrofacts_exlog_${dateKey(new Date())}`; }
  function loadList(key) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : []; } catch(e) { return []; } }
  function saveLog(list) { localStorage.setItem(todayKey(), JSON.stringify(list)); }
  function saveExLog(list) { localStorage.setItem(todayExKey(), JSON.stringify(list)); }

  const state = {
    sex: "female",
    age: 29,
    heightFt: 5,
    heightIn: 6,
    weightLb: 143,
    activity: 1.375,
    goal: "maintain",
    premium: alreadyPremium,
    showUpgrade: false,
    ratio: { protein: 30, carb: 40, fat: 30 },
    weighIns: loadWeighIns(),
    newWeighIn: "",
    log: loadList(todayKey()),
    logMode: "list",
    logFoodName: "",
    logGrams: "",
    customName: "",
    customKcal: "",
    customProtein: "",
    exLog: loadList(todayExKey()),
    exMode: "list",
    exName: "",
    exMinutes: "",
    exCustomName: "",
    exCustomKcal: "",
    trendMetric: "cal",
    toast: null,
  };

  function bmr() {
    const s = state.sex === "male" ? 5 : -161;
    const heightCm = ((state.heightFt * 12) + state.heightIn) * 2.54;
    const weightKg = state.weightLb * 0.453592;
    return 10 * weightKg + 6.25 * heightCm - 5 * state.age + s;
  }
  function tdee() { return bmr() * state.activity; }
  function baseGoalCalories() {
    const t = tdee();
    if (state.goal === "lose") return t - 500;
    if (state.goal === "gain") return t + 300;
    return t;
  }

  function weeklyAdjustment() {
    const entries = state.weighIns;
    if (entries.length < 2) return { delta: 0, message: null };
    const sorted = [...entries].sort((a,b) => a.t - b.t);
    const recent = sorted.slice(-3);
    const first = recent[0];
    const last = recent[recent.length - 1];
    const daysBetween = Math.max(1, (last.t - first.t) / 86400000);
    const lbChange = last.w - first.w;
    const lbPerWeek = (lbChange / daysBetween) * 7;

    let targetRatePerWeek = 0;
    if (state.goal === "lose") targetRatePerWeek = -1;
    if (state.goal === "gain") targetRatePerWeek = 0.5;

    const diff = lbPerWeek - targetRatePerWeek;
    let delta = -diff * 500;
    delta = Math.max(-150, Math.min(150, Math.round(delta / 10) * 10));

    let message;
    if (state.goal === "maintain") {
      if (Math.abs(lbPerWeek) < 0.3) message = `Weight's been steady (${lbPerWeek.toFixed(1)} lb/wk) — target unchanged.`;
      else message = `Trending ${lbPerWeek > 0 ? 'up' : 'down'} ${Math.abs(lbPerWeek).toFixed(1)} lb/wk. Adjusted by <strong>${delta > 0 ? '+' : ''}${delta} kcal</strong> to hold steady.`;
    } else if (state.goal === "lose") {
      message = `Losing ${Math.abs(Math.min(0,lbPerWeek)).toFixed(1)} lb/wk (target: 1 lb/wk). Adjusted by <strong>${delta > 0 ? '+' : ''}${delta} kcal</strong>.`;
    } else {
      message = `Gaining ${lbPerWeek.toFixed(1)} lb/wk (target: 0.5 lb/wk). Adjusted by <strong>${delta > 0 ? '+' : ''}${delta} kcal</strong>.`;
    }
    return { delta, message };
  }

  function goalCalories() {
    const adj = weeklyAdjustment();
    return baseGoalCalories() + adj.delta;
  }
  function activeRatio() { return state.premium ? state.ratio : { protein: 30, carb: 40, fat: 30 }; }
  function grams() {
    const cal = goalCalories();
    const r = activeRatio();
    return {
      protein: Math.round((cal * (r.protein / 100)) / 4),
      carb: Math.round((cal * (r.carb / 100)) / 4),
      fat: Math.round((cal * (r.fat / 100)) / 9),
    };
  }

  function loggedTotals() {
    return state.log.reduce((acc, item) => { acc.kcal += item.kcal; acc.protein += item.protein; return acc; }, { kcal: 0, protein: 0 });
  }
  function burnedTotal() {
    return state.exLog.reduce((acc, item) => acc + item.kcal, 0);
  }
  function exerciseMinutesTotal() {
    return state.exLog.reduce((acc, item) => acc + (item.minutes || 0), 0);
  }

  function proteinSuggestions(remainingG) {
    const options = [
      FOOD_DB.find(f => f.name === "Chicken breast, cooked"),
      FOOD_DB.find(f => f.name === "Greek yogurt, plain nonfat"),
      FOOD_DB.find(f => f.name === "Protein powder, whey (dry)"),
    ].filter(Boolean);
    return options.slice(0, 2).map(f => {
      const g2 = Math.round(remainingG / (f.protein / 100));
      return `${g2}g of ${f.name.split(',')[0].toLowerCase()}`;
    });
  }

  function verdict() {
    const totals = loggedTotals();
    const effectiveGoal = Math.round(goalCalories()) + Math.round(burnedTotal());
    const proteinTarget = grams().protein;
    if (totals.kcal === 0) return null;

    const calPct = totals.kcal / effectiveGoal;
    const proteinPct = proteinTarget > 0 ? totals.protein / proteinTarget : 1;
    const calDiff = Math.round(totals.kcal - effectiveGoal);
    const proteinDiff = Math.round(proteinTarget - totals.protein);

    if (calPct >= 0.93 && calPct <= 1.07 && proteinPct >= 0.95) {
      return { type: "good", message: "🎉 Nice work — you're right on target today for both calories and protein." };
    }
    if (calPct > 1.07) {
      return { type: "over", message: `You're <strong>${calDiff} kcal over</strong> today's target. Try a lighter next meal — more vegetables, less added fat — or a short walk to help balance it out.` };
    }
    if (proteinPct < 0.95) {
      const sugg = proteinSuggestions(proteinDiff);
      return { type: "under-protein", message: `You're <strong>${proteinDiff}g short on protein</strong> today. Adding ${sugg.join(' or ')} would close the gap.` };
    }
    if (calPct < 0.93) {
      const calShort = Math.round(effectiveGoal - totals.kcal);
      return { type: "under-cal", message: `You've got <strong>${calShort} kcal left</strong> today — enough room for a real snack. A Greek yogurt or a piece of fruit with nut butter would fit well.` };
    }
    return { type: "good", message: "🎉 You're tracking well today — keep it up." };
  }

  function showToast(v) {
    if (!v) return;
    state.toast = v;
    render();
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => {
      state.toast = null;
      const el = document.getElementById('toastBanner');
      if (el) el.remove();
    }, 5500);
  }

  function toastHTML() {
    if (!state.toast) return '';
    const bg = state.toast.type === 'good' ? '#4F6B45' : ((state.toast.type === 'over' || state.toast.type === 'error') ? '#D14B32' : '#1C1B29');
    return `

  }

  function todayLabel() {
    return new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function sparklineSVG(entries, color) {
    if (entries.length < 2) return null;
    const w = 380, h = 90, pad = 14;
    const weights = entries.map(e => e.w);
    const min = Math.min(...weights), max = Math.max(...weights);
    const range = Math.max(1, max - min);
    const stepX = (w - pad*2) / (entries.length - 1);
    const pts = entries.map((e,i) => {
      const x = pad + i*stepX;
      const y = pad + (1 - (e.w - min)/range) * (h - pad*2);
      return [x,y];
    });
    const pathD = pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${color||'#1C1B29'}" stroke="#F5C518" stroke-width="1.5"/>`).join('');
    return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;">
      <path d="${pathD}" fill="none" stroke="${color||'#1C1B29'}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
    </svg>`;
  }

  // ---- Multi-day history for trends ----
  function getHistory(days) {
    const out = [];
    const now = new Date();
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      const foodItems = loadList(`macrofacts_log_${dateKey(d)}`);
      const exItems = loadList(`macrofacts_exlog_${dateKey(d)}`);
      const kcal = foodItems.reduce((a,it) => a + it.kcal, 0);
      const protein = foodItems.reduce((a,it) => a + it.protein, 0);
      const burned = exItems.reduce((a,it) => a + it.kcal, 0);
      out.push({ date: d, kcal, protein, burned });
    }
    return out;
  }

  function trendChartSVG(metric) {
    const days = 14;
    const history = getHistory(days);
    const w = 380, h = 130, pad = 16;
    const goalCal = Math.round(goalCalories());
    const proteinTarget = grams().protein;
    const values = history.map(e => metric === 'protein' ? e.protein : (e.kcal - e.burned));
    const goalVal = metric === 'protein' ? proteinTarget : goalCal;
    const maxVal = Math.max(goalVal, ...values, 1) * 1.15;
    const stepX = (w - pad*2) / (days - 1);
    const yFor = v => pad + (1 - v / maxVal) * (h - pad*2);
    const pts = values.map((v,i) => [pad + i*stepX, yFor(v)]);
    const pathD = pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const goalY = yFor(goalVal).toFixed(1);
    const dots = pts.map((p,i) => {
      const v = values[i];
      let color = '#1C1B29';
      if (v > 0) {
        const pct = v / goalVal;
        if (metric === 'protein') color = pct >= 0.95 ? '#4F6B45' : '#C99A2E';
        else color = (pct >= 0.93 && pct <= 1.07) ? '#4F6B45' : (pct > 1.07 ? '#D14B32' : '#C99A2E');
      }
      return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}" stroke="#1C1B29" stroke-width="1"/>`;
    }).join('');
    const startLabel = history[0].date.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    const endLabel = history[days-1].date.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    return `<svg width="100%" viewBox="0 0 ${w} ${h+18}" style="display:block;">
      <line x1="${pad}" y1="${goalY}" x2="${w-pad}" y2="${goalY}" stroke="#1C1B29" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
      <path d="${pathD}" fill="none" stroke="#1C1B29" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>
      ${dots}
      <text x="${pad}" y="${h+14}" font-size="9" fill="#1C1B29" opacity="0.45">${startLabel}</text>
      <text x="${w-pad}" y="${h+14}" font-size="9" fill="#1C1B29" opacity="0.45" text-anchor="end">${endLabel}</text>
    </svg>`;
  }

  function tinyHistorySVG() {
    const history = getHistory(14);
    const w = 160, h = 60;
    const goalCal = Math.round(goalCalories());
    const values = history.map(e => e.kcal - e.burned);
    const maxVal = Math.max(goalCal, ...values, 1) * 1.15;
    const stepX = w / 13;
    const pts = values.map((v,i) => [i*stepX, h - (v/maxVal)*h]);
    const pathD = pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    return `<svg width="100%" height="60" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;">
      <path d="${pathD}" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
  }

  function ringSVG(pct, color) {
    const r = 30, c = 2 * Math.PI * r;
    const offset = c * (1 - Math.min(1, pct));
    return `<svg width="76" height="76" viewBox="0 0 76 76">
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="rgba(28,27,41,0.1)" stroke-width="9"/>
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 38 38)"/>
    </svg>`;
  }

    return `
        <div class="card-body">
          <div class="toggle-row" style="margin-bottom:0.9rem;">
            <button class="toggle-btn ${state.exMode==='list'?'active':''}" data-act="exMode" data-val="list">From list</button>
            <button class="toggle-btn ${state.exMode==='custom'?'active':''}" data-act="exMode" data-val="custom">Custom</button>
          </div>
          ${state.exMode === 'list' ? `
            <div style="margin-bottom:0.8rem;">
              <div class="field-label">Activity</div>
              <input list="exerciseDatalist" id="exName" value="${state.exName}" placeholder="Start typing… e.g. Running" />
              <datalist id="exerciseDatalist">${EXERCISE_DB.map(f => `<option value="${f.name}">`).join('')}</datalist>
            </div>
            <div class="weigh-in-row">
              <div style="flex:1;">
                <div class="field-label">Duration (minutes)</div>
                <input type="number" id="exMinutes" value="${state.exMinutes}" placeholder="e.g. 30" min="1" max="300" />
              </div>
              <button class="log-btn" id="addExLogBtn">Add</button>
            </div>
          ` : `
            <div style="margin-bottom:0.8rem;">
              <div class="field-label">Activity name</div>
              <input type="text" id="exCustomName" value="${state.exCustomName}" placeholder="e.g. Rock climbing" />
            </div>
            <div style="margin-bottom:0.8rem;">
              <div class="field-label">Calories burned</div>
              <input type="number" id="exCustomKcal" value="${state.exCustomKcal}" placeholder="e.g. 250" min="0" max="2000" />
            </div>
            <button class="log-btn" id="addExCustomLogBtn" style="width:100%;">Add to log</button>
          `}

          ${state.exLog.length > 0 ? `
            <div style="margin-top:1.1rem;">
              ${state.exLog.map((item, i) => `
                <div class="macro-row">
                  <div class="macro-left">
                    <span class="macro-name">${item.name}${item.minutes ? ` <span class="mono" style="opacity:0.5;font-size:0.72rem;">(${item.minutes} min)</span>` : ''}</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:0.6rem;">
                    <span class="mono" style="font-size:0.78rem;">${Math.round(item.kcal)}kcal</span>
                    <button data-remove-ex="${i}" style="background:none;border:none;cursor:pointer;font-size:0.9rem;opacity:0.5;padding:0 0.2rem;">×</button>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : `<div class="empty-trend">No exercise logged yet today.</div>`}

          <div class="adjust-msg" style="margin-top:1rem;margin-bottom:0;">
            <span class="mono"><strong>${totalBurned}</strong> kcal burned</span> &nbsp;·&nbsp; <span class="mono"><strong>${totalMinutes}</strong> min active</span>
            <br/><span style="opacity:0.6;font-size:0.8rem;">Burned calories are added back to your food budget above.</span>
          </div>
        </div>`;
  }

  function lockedBody() {
    return `
      <div class="premium-locked">
        <p>Set your own protein, carb, and fat split instead of the standard 30/40/30 — useful for keto, high-protein cuts, or endurance training.</p>
        <button class="cta" id="unlockBtn">Unlock Custom Splits →</button>
      </div>`;
  }

  function premiumBody() {
    const keys = [["protein","Protein"],["carb","Carbohydrate"],["fat","Fat"]];
    const ratioSum = state.ratio.protein + state.ratio.carb + state.ratio.fat;
    return `
      <div class="card-body">
        ${keys.map(([k,label]) => `
          <div class="slider-block">
            <div class="slider-top"><span>${label}</span><span class="mono"><strong>${state.ratio[k]}%</strong></span></div>
            <input type="range" min="5" max="70" value="${state.ratio[k]}" data-ratio="${k}" />
          </div>
        `).join('')}
        <div class="ratio-note" style="color:${ratioSum===100?'inherit':'#D14B32'}">
          ${ratioSum===100 ? 'Splits add up to 100%.' : `Splits add to ${ratioSum}% — adjust so they total 100%.`}
        </div>
      </div>`;
  }

  function upgradeModal() {
    return `
      <div class="modal-bg" id="modalBg">
        <div class="modal">
          <div class="field-label">Macro Facts Premium</div>
          <div class="price display">$2.99/mo</div>
          <ul>
            <li>✓ Daily food log with instant calorie &amp; protein tracking</li>
            <li>✓ Goal notifications with improvement suggestions</li>
            <li>✓ Custom macro splits</li>
            <li>✓ No ads</li>
          </ul>
          <a class="btn-primary" id="purchaseBtn" href="${STRIPE_PAYMENT_LINK}" style="display:block;text-decoration:none;text-align:center;">Continue to Payment</a>
          <button class="btn-secondary" id="cancelBtn">Cancel</button>
        </div>
      </div>`;
  }

  function attachHandlers() {
    document.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', () => {
        state[btn.dataset.act] = btn.dataset.val;
        render();
      });
    });
    const ageEl = document.getElementById('age');
    if (ageEl) ageEl.addEventListener('change', e => { state.age = clamp(+e.target.value,14,90); render(); });
    const heightFtEl = document.getElementById('heightFt');
    if (heightFtEl) heightFtEl.addEventListener('change', e => { state.heightFt = clamp(+e.target.value,3,7); render(); });
    const heightInEl = document.getElementById('heightIn');
    if (heightInEl) heightInEl.addEventListener('change', e => { state.heightIn = clamp(+e.target.value,0,11); render(); });
    const weightEl = document.getElementById('weight');
    if (weightEl) weightEl.addEventListener('change', e => { state.weightLb = clamp(+e.target.value,80,450); render(); });
    const activityEl = document.getElementById('activity');
    if (activityEl) activityEl.addEventListener('change', e => { state.activity = parseFloat(e.target.value); render(); });

    const weighInInput = document.getElementById('weighInInput');
    if (weighInInput) weighInInput.addEventListener('input', e => { state.newWeighIn = e.target.value; });
    const logBtn = document.getElementById('logWeighInBtn');
    if (logBtn) logBtn.addEventListener('click', () => {
      const val = parseFloat(state.newWeighIn);
      if (!val || val < 60 || val > 500) return;
      state.weighIns.push({ t: Date.now(), w: val });
      saveWeighIns(state.weighIns);
      state.newWeighIn = "";
      render();
    });

    const logFoodNameEl = document.getElementById('logFoodName');
    if (logFoodNameEl) logFoodNameEl.addEventListener('input', e => { state.logFoodName = e.target.value; });
    const logGramsEl = document.getElementById('logGrams');
    if (logGramsEl) logGramsEl.addEventListener('input', e => { state.logGrams = e.target.value; });
    const customNameEl = document.getElementById('customName');
    if (customNameEl) customNameEl.addEventListener('input', e => { state.customName = e.target.value; });
    const customKcalEl = document.getElementById('customKcal');
    if (customKcalEl) customKcalEl.addEventListener('input', e => { state.customKcal = e.target.value; });
    const customProteinEl = document.getElementById('customProtein');
    if (customProteinEl) customProteinEl.addEventListener('input', e => { state.customProtein = e.target.value; });

    const addLogBtn = document.getElementById('addLogBtn');
    if (addLogBtn) addLogBtn.addEventListener('click', () => {
      const nameVal = (document.getElementById('logFoodName').value || '').trim();
      const gramsVal = parseFloat(document.getElementById('logGrams').value);
      const match = FOOD_DB.find(f => f.name.toLowerCase() === nameVal.toLowerCase());
      if (!match) {
        showToast({ type: 'error', message: `Couldn't find "${nameVal || '(empty)'}" in the list — pick a suggestion from the dropdown, or switch to Custom.` });
        return;
      }
      if (!gramsVal || gramsVal <= 0) {
        showToast({ type: 'error', message: 'Enter an amount in grams before adding.' });
        return;
      }
      state.log.push({ name: match.name, grams: gramsVal, kcal: (match.kcal/100)*gramsVal, protein: (match.protein/100)*gramsVal });
      saveLog(state.log);
      state.logFoodName = ""; state.logGrams = "";
      render();
      showToast(verdict());
    });
    const addCustomLogBtn = document.getElementById('addCustomLogBtn');
    if (addCustomLogBtn) addCustomLogBtn.addEventListener('click', () => {
      const nameVal = (document.getElementById('customName').value || '').trim();
      const kcal = parseFloat(document.getElementById('customKcal').value);
      const protein = parseFloat(document.getElementById('customProtein').value) || 0;
      if (!nameVal) { showToast({ type: 'error', message: 'Enter a food name before adding.' }); return; }
      if (!kcal || kcal < 0) { showToast({ type: 'error', message: 'Enter the calories for this food.' }); return; }
      state.log.push({ name: nameVal, grams: null, kcal, protein });
      saveLog(state.log);
      state.customName = ""; state.customKcal = ""; state.customProtein = "";
      render();
      showToast(verdict());
    });
    document.querySelectorAll('[data-remove-log]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.removeLog);
        state.log.splice(idx, 1);
        saveLog(state.log);
        render();
      });
    });

    const exNameEl = document.getElementById('exName');
    if (exNameEl) exNameEl.addEventListener('input', e => { state.exName = e.target.value; });
    const exMinutesEl = document.getElementById('exMinutes');
    if (exMinutesEl) exMinutesEl.addEventListener('input', e => { state.exMinutes = e.target.value; });
    const exCustomNameEl = document.getElementById('exCustomName');
    if (exCustomNameEl) exCustomNameEl.addEventListener('input', e => { state.exCustomName = e.target.value; });
    const exCustomKcalEl = document.getElementById('exCustomKcal');
    if (exCustomKcalEl) exCustomKcalEl.addEventListener('input', e => { state.exCustomKcal = e.target.value; });

    const addExLogBtn = document.getElementById('addExLogBtn');
    if (addExLogBtn) addExLogBtn.addEventListener('click', () => {
      const nameVal = (document.getElementById('exName').value || '').trim();
      const minutes = parseFloat(document.getElementById('exMinutes').value);
      const match = EXERCISE_DB.find(f => f.name.toLowerCase() === nameVal.toLowerCase());
      if (!match) {
        showToast({ type: 'error', message: `Couldn't find "${nameVal || '(empty)'}" in the list — pick a suggestion from the dropdown, or switch to Custom.` });
        return;
      }
      if (!minutes || minutes <= 0) {
        showToast({ type: 'error', message: 'Enter how many minutes before adding.' });
        return;
      }
      const weightKg = state.weightLb * 0.453592;
      const kcal = (match.met * 3.5 * weightKg / 200) * minutes;
      state.exLog.push({ name: match.name, minutes: minutes, kcal: kcal });
      saveExLog(state.exLog);
      state.exName = ""; state.exMinutes = "";
      render();
    });
    const addExCustomLogBtn = document.getElementById('addExCustomLogBtn');
    if (addExCustomLogBtn) addExCustomLogBtn.addEventListener('click', () => {
      const kcal = parseFloat(state.exCustomKcal);
      if (!state.exCustomName.trim() || !kcal || kcal < 0) return;
      state.exLog.push({ name: state.exCustomName.trim(), minutes: null, kcal });
      saveExLog(state.exLog);
      state.exCustomName = ""; state.exCustomKcal = "";
      render();
    });
    document.querySelectorAll('[data-remove-ex]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.removeEx);
        state.exLog.splice(idx, 1);
        saveExLog(state.exLog);
        render();
      });
    });

    const closeToastBtn = document.getElementById('closeToastBtn');
    if (closeToastBtn) closeToastBtn.addEventListener('click', () => {
      state.toast = null;
      clearTimeout(window.__toastTimer);
      render();
    });

    const unlockBtn = document.getElementById('unlockBtn');
    if (unlockBtn) unlockBtn.addEventListener('click', () => { state.showUpgrade = true; render(); });
    const unlockFoodLogBtn = document.getElementById('unlockFoodLogBtn');
    if (unlockFoodLogBtn) unlockFoodLogBtn.addEventListener('click', () => { state.showUpgrade = true; render(); });
    const cancelBtn = document.getElementById('cancelBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', () => { state.showUpgrade = false; render(); });

    document.querySelectorAll('[data-ratio]').forEach(sl => {
      sl.addEventListener('input', e => {
        state.ratio[e.target.dataset.ratio] = +e.target.value;
        render();
      });
    });
  }

  function clamp(v, min, max) { return Math.min(max, Math.max(min, isNaN(v) ? min : v)); }

  render();
})();
</script>
</body>
</html>
